<?xml version="1.0"?>
<!--
  es_systems.cfg
  Defines the systems shown in EmulationStation and which libretro core
  each one launches via RetroArch's runcommand wrapper. ROMs go in the
  matching folder under /home/pi/RetroPie/roms/<system>/.

  Performance note (Raspberry Pi 1, single-core ARM11 @ 700MHz, no NEON):
  nes / snes / gba / genesis are realistically playable. psx is hit or miss
  and only recommended for simple 2D-heavy titles. n64 is included because
  it was explicitly requested, but expect it to be unplayably slow or fail
  to boot most titles - there is no Pi-1-class N64 core. See README.md.

  IMPORTANT: the 3rd argument to runcommand.sh's "_SYS_" form must be the
  ES system name (matching <name> below, e.g. "nes"), NOT the libretro core
  id (e.g. "lr-fceumm"). runcommand.sh uses it to look up
  /opt/retropie/configs/<system>/emulators.cfg, which is keyed by system
  name and was populated with the actual core command by that core's own
  RetroPie-Setup install step. Passing the core id here instead points at a
  config path that doesn't exist, and every game launch fails immediately.
-->
<systemList>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>/home/pi/RetroPie/roms/nes</path>
    <extension>.nes .NES .zip .ZIP</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ nes %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
  </system>

  <system>
    <name>snes</name>
    <fullname>Super Nintendo Entertainment System</fullname>
    <path>/home/pi/RetroPie/roms/snes</path>
    <extension>.smc .sfc .SMC .SFC .zip .ZIP</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ snes %ROM%</command>
    <platform>snes</platform>
    <theme>snes</theme>
  </system>

  <system>
    <name>gba</name>
    <fullname>Game Boy Advance</fullname>
    <path>/home/pi/RetroPie/roms/gba</path>
    <extension>.gba .GBA .zip .ZIP</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ gba %ROM%</command>
    <platform>gba</platform>
    <theme>gba</theme>
  </system>

  <system>
    <name>genesis</name>
    <fullname>Sega Genesis / Mega Drive</fullname>
    <path>/home/pi/RetroPie/roms/genesis</path>
    <extension>.md .bin .gen .smd .MD .BIN .GEN .SMD .zip .ZIP</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ genesis %ROM%</command>
    <platform>genesis</platform>
    <theme>genesis</theme>
  </system>

  <system>
    <name>psx</name>
    <fullname>Sony PlayStation (limited performance on Pi 1)</fullname>
    <path>/home/pi/RetroPie/roms/psx</path>
    <extension>.cue .img .pbp .CUE .IMG .PBP .zip .ZIP</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ psx %ROM%</command>
    <platform>psx</platform>
    <theme>psx</theme>
  </system>

  <system>
    <name>n64</name>
    <fullname>Nintendo 64 (experimental - not realistically playable on Pi 1)</fullname>
    <path>/home/pi/RetroPie/roms/n64</path>
    <extension>.n64 .z64 .v64 .N64 .Z64 .V64 .zip .ZIP</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ n64 %ROM%</command>
    <platform>n64</platform>
    <theme>n64</theme>
  </system>
</systemList>
