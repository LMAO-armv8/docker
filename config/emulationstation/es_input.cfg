<?xml version="1.0"?>
<!--
  es_input.cfg
  Default EmulationStation input profile for a generic Xbox360-layout
  USB/Bluetooth controller exposed through xboxdrv. This is a starting
  point, not a guarantee - device names/GUIDs vary between controller
  clones. If your pad isn't recognised correctly on first boot, press F4
  to quit to a terminal, or just hold any button when EmulationStation
  shows "press a button" and follow its own input configurator, which
  will overwrite this file with a profile matched to your exact pad.
-->
<inputList>
  <inputConfig type="joystick" deviceName="Xbox 360 Wired Controller" deviceGUID="030000005e0400008e02000014010000">
    <input name="a" type="button" id="0" value="1" />
    <input name="b" type="button" id="1" value="1" />
    <input name="x" type="button" id="2" value="1" />
    <input name="y" type="button" id="3" value="1" />
    <input name="leftshoulder" type="button" id="4" value="1" />
    <input name="rightshoulder" type="button" id="5" value="1" />
    <input name="back" type="button" id="6" value="1" />
    <input name="start" type="button" id="7" value="1" />
    <input name="leftthumbstickclick" type="button" id="8" value="1" />
    <input name="rightthumbstickclick" type="button" id="9" value="1" />
    <input name="up" type="hat" id="0" value="1" />
    <input name="down" type="hat" id="0" value="4" />
    <input name="left" type="hat" id="0" value="8" />
    <input name="right" type="hat" id="0" value="2" />
    <input name="leftthumbstickx" type="axis" id="0" value="1" />
    <input name="leftthumbsticky" type="axis" id="1" value="1" />
    <input name="rightthumbstickx" type="axis" id="3" value="1" />
    <input name="rightthumbsticky" type="axis" id="4" value="1" />
    <input name="lefttrigger" type="axis" id="2" value="1" />
    <input name="righttrigger" type="axis" id="5" value="1" />
  </inputConfig>
</inputList>
