# retroarch.cfg
# Global RetroArch configuration for the Smart TV / Retro Pi 1 image.
# Lives at /opt/retropie/configs/all/retroarch.cfg on the target device.

# --- Input ------------------------------------------------------------
input_driver = "udev"
input_joypad_driver = "udev"

# Let RetroArch auto-detect and apply the correct button mapping for
# whatever controller is plugged in (xboxdrv presents itself as a standard
# joypad device, so RetroArch's own Xbox360-pad autoconfig profile applies
# automatically in the vast majority of cases).
input_autodetect_enable = true
joypad_autoconfig_dir = "/opt/retropie/configs/all/retroarch/autoconfig"

# Fallback manual binds for a generic Xbox-style USB/Bluetooth pad, used
# only if autoconfig fails to recognise the device. Standard Xbox360-layout
# button order: A=0 B=1 X=2 Y=3 LB=4 RB=5 Back=6 Start=7 LSB=8 RSB=9.
input_player1_a_btn = "0"
input_player1_b_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_select_btn = "6"
input_player1_start_btn = "7"
input_player1_l3_btn = "8"
input_player1_r3_btn = "9"
input_player1_left_axis = "-0"
input_player1_right_axis = "+0"
input_player1_up_axis = "-1"
input_player1_down_axis = "+1"

# Hotkey: hold Select (Back) + Start to exit a running core back to
# EmulationStation, matching the "Return to Kodi" flow documented in
# README.md (EmulationStation itself is then exited the same way to
# return to Kodi).
input_enable_hotkey_btn = "6"
input_exit_emulator_btn = "7"
input_menu_toggle_btn = "8"

# --- Video --------------------------------------------------------------
# Pi 1 has no NEON and a comparatively weak VideoCore IV GPU; keep video
# processing cheap.
video_driver = "gl"
video_threaded = false
video_vsync = true
video_smooth = false
video_shader_enable = false
video_fullscreen = true

# --- Audio ----------------------------------------------------------------
audio_driver = "alsa"
audio_latency = "128"

# --- Misc ------------------------------------------------------------
rgui_show_start_screen = false
config_save_on_exit = false
savefile_directory = "/home/pi/RetroPie/saves"
savestate_directory = "/home/pi/RetroPie/saves"
system_directory = "/home/pi/RetroPie/BIOS"
