name: Build and Push

on:
  push:
    branches:
      - project2
  workflow_dispatch:

env:
  GITHUB_USERNAME: lmao-armv8
  IMAGE_NAME: ubuntu

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GH_TOKEN }}" | \
          docker login ghcr.io \
          -u ${{ github.actor }} \
          --password-stdin

      - name: Build Image
        run: |
          docker build \
            -t ghcr.io/${GITHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG} \
            -f ubuntu/Dockerfile .

      - name: Push Image
        run: |
          docker push \
            ghcr.io/${GITHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}

      - name: Logout
        run: docker logout ghcr.io
