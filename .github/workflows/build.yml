name: Build Raspberry Pi Smart TV / Retro image

# Triggers:
#   - push to main (auto build + publish a release)
#   - manual run from the Actions tab (workflow_dispatch), useful for testing
#     a branch without creating a release
on:
  push:
    branches: [ main, raspi-smarttv-retro ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release for this run"
        type: boolean
        default: false
      clean_cache:
        description: "Delete persisted pi-gen qcow2 cache before building"
        type: boolean
        default: false

env:
  IMG_NAME: smarttv-retro-pi1
  PI_GEN_BRANCH: buster          # last pi-gen branch with first-class ARMv6 (Pi 1) support
  PI_GEN_RELEASE: buster         # Debian/Raspberry Pi OS release matching that branch
  PI_GEN_CACHE_DIR: /home/github-runner/.cache/smarttv-pi-gen

# A full desktop-less pi-gen build comfortably fits the free-tier 6 hour job
# limit, but it needs more scratch disk than the default runner ships with,
# so step 2 below reclaims space before the build starts.
#
# pi-gen's default USE_QCOW2=1 mode chains stage images through qemu-nbd.
# ubuntu-latest (24.04, kernel 6.9+) has a known NBD regression that breaks
# stage1+ with "read error, sector 0" / missing /dev/mapper/nbd0p2. Pin to
# ubuntu-22.04 (kernel 6.8) where NBD + qcow2 backing chains still work.
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, pi-gen]
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clear pi-gen cache (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.clean_cache
        run: |
          chmod +x scripts/pi-gen-cache.sh
          scripts/pi-gen-cache.sh clean

      - name: Install pi-gen host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-static binfmt-support debootstrap \
            zerofree zip dosfstools libarchive-tools libcap2-bin grep rsync \
            xz-utils file xxd kmod git curl bc qemu-utils kpartx gpg pigz
          # qemu-user-static's postinst normally registers the ARM binfmt
          # handler automatically, but re-asserting this is cheap insurance:
          # without a working registration, every chroot command pi-gen runs
          # against the ARMv6 rootfs fails with "exec format error".
          sudo update-binfmts --enable qemu-arm

      - name: Clone pi-gen (buster branch, ARMv6/armhf compatible)
        run: |
          chmod +x scripts/pi-gen-cache.sh
          scripts/pi-gen-cache.sh clone-pigen

      - name: Patch pi-gen for GitHub Actions compatibility
        run: |
          # Raspbian Buster was removed from raspbian.raspberrypi.org in late
          # 2025. The pi-gen buster branch still points at that dead URL for
          # debootstrap and the initial apt sources, which fails stage0 with:
          #   E: Failed getting release file .../dists/buster/Release
          # legacy.raspbian.org is the official archive mirror; archive.raspberrypi.org
          # (used for Pi-specific packages like Kodi) is still live and unchanged.
          sed -i 's|http://raspbian.raspberrypi.org/raspbian/|https://legacy.raspbian.org/raspbian/|g' \
            pi-gen/stage0/prerun.sh \
            pi-gen/stage0/00-configure-apt/files/sources.list

          # qemu-utils on ubuntu-latest now rejects qcow2 overlays created without
          # an explicit backing format ("Backing file specified without backing
          # format"), which breaks stage1+ when pi-gen chains stage images.
          sed -i 's|backing_file=\${WORK_DIR}/image-\${PREV_STAGE}\.qcow2|backing_file=${WORK_DIR}/image-${PREV_STAGE}.qcow2,backing_fmt=qcow2|' \
            pi-gen/scripts/qcow2_handling
          sed -i 's|qemu-img rebase -f qcow2 -u -b \${PREV_IMG}\.qcow2|qemu-img rebase -f qcow2 -u -b ${PREV_IMG}.qcow2 -F qcow2|' \
            pi-gen/build.sh

          # Explicit qcow2 format on NBD connect (required by newer qemu-utils).
          sed -i 's|qemu-nbd --discard=unmap -c $NBD_DEV|qemu-nbd -f qcow2 --discard=unmap -c $NBD_DEV|' \
            pi-gen/scripts/qcow2_handling

          # legacy.raspbian.org is reliable but can return transient "Undetermined
          # Error" fetches when stage2 pulls ~150 MB of packages through a qemu
          # chroot. Install global apt retry settings early and retry whole apt
          # install commands if a batch still fails.
          cat > pi-gen/stage0/00-configure-apt/files/80-archive-retries <<'EOF'
          Acquire::Retries "10";
          Acquire::https::Timeout "120";
          Acquire::http::Timeout "120";
          Acquire::Check-Valid-Until "false";
          EOF
          sed -i '/install -m 644 files\/raspi.list/a install -m 644 files/80-archive-retries "${ROOTFS_DIR}/etc/apt/apt.conf.d/80-archive-retries"' \
            pi-gen/stage0/00-configure-apt/00-run.sh

          # Package postinst scripts (dbus, avahi, ssh, etc.) call invoke-rc.d
          # during apt installs. In the build chroot there is no running init or
          # system dbus, so "force-reload" fails and can abort dpkg. policy-rc.d
          # tells invoke-rc.d to skip service actions for the whole build; our
          # cleanup stage removes it before the image is exported.
          cat > pi-gen/stage0/00-configure-apt/files/policy-rc.d <<'EOF'
          #!/bin/sh
          exit 101
          EOF
          chmod +x pi-gen/stage0/00-configure-apt/files/policy-rc.d
          sed -i '/install -m 644 files\/raspi.list/a install -d "${ROOTFS_DIR}/usr/sbin"' \
            pi-gen/stage0/00-configure-apt/00-run.sh
          sed -i '/install -d "\${ROOTFS_DIR}\/usr\/sbin"/a install -m 755 files/policy-rc.d "${ROOTFS_DIR}/usr/sbin/policy-rc.d"' \
            pi-gen/stage0/00-configure-apt/00-run.sh

          python3 <<'PY'
          import re
          from pathlib import Path

          build_sh = Path("pi-gen/build.sh")
          text = build_sh.read_text()
          pattern = re.compile(
              r"on_chroot << EOF\n(apt-get -o APT::Acquire::Retries=3 install(?: --no-install-recommends)? -y \$PACKAGES)\nEOF"
          )

          def repl(match):
              cmd = match.group(1).replace("Retries=3", "Retries=10")
              return (
                  "on_chroot << EOF\n"
                  "for attempt in 1 2 3 4 5; do\n"
                  f"  {cmd} && break\n"
                  "  [ \\$attempt -eq 5 ] && exit 1\n"
                  "  sleep 20\n"
                  "done\n"
                  "EOF"
              )

          text, count = pattern.subn(repl, text)
          if count != 2:
              raise SystemExit(f"expected to patch 2 apt install hooks in pi-gen/build.sh, got {count}")
          build_sh.write_text(text)
          PY

          # Lazy umount avoids infinite "target is busy" on bind-mounted /dev when
          # qemu-user-static or host systemd still holds device nodes open.
          python3 <<'PY'
          import re
          from pathlib import Path

          common = Path("pi-gen/scripts/common")
          text = common.read_text()
          if 'umount -l "$loc"' not in text:
              pat = re.compile(r'^([ \t]+)umount "\$loc"\s*$', re.MULTILINE)
              if not pat.search(text):
                  raise SystemExit("expected umount line in pi-gen/scripts/common")
              text = pat.sub(
                  r'\1umount -l "$loc" 2>/dev/null || umount "$loc" 2>/dev/null || true',
                  text,
                  count=1,
              )
              common.write_text(text)

          qcow2 = Path("pi-gen/scripts/qcow2_handling")
          text = qcow2.read_text()
          if 'umount -l "$loc"' not in text:
              pat = re.compile(
                  r'^([ \t]+)while mountpoint -q "\$loc" && ! umount "\$loc"; do\n'
                  r'([ \t]+)sleep 0\.1\n'
                  r'([ \t]+)done',
                  re.MULTILINE,
              )
              match = pat.search(text)
              if not match:
                  raise SystemExit("expected umount loop in pi-gen/scripts/qcow2_handling")
              repl = (
                  f'{match.group(1)}while mountpoint -q "$loc"; do\n'
                  f'{match.group(2)}umount -l "$loc" 2>/dev/null || umount "$loc" 2>/dev/null || sleep 0.1\n'
                  f'{match.group(3)}done'
              )
              qcow2.write_text(pat.sub(repl, text, count=1))
          PY

          # Export resize: e2fsck must repair the rootfs before resize2fs runs.
          # A failed/aborted prior export can leave extent errors that resize2fs
          # cannot handle when e2fsck is ignored (pi-gen defaults to || true).
          python3 <<'PY'
          from pathlib import Path

          qcow2 = Path("pi-gen/scripts/qcow2_handling")
          text = qcow2.read_text()
          old = "\te2fsck -y -f $MAP_ROOT_DEV || true\n"
          new = (
              "\tfor fs_pass in 1 2 3; do\n"
              "\t\te2fsck -fy $MAP_ROOT_DEV && break\n"
              "\t\te2fsck -fy $MAP_ROOT_DEV || true\n"
              "\t\tsleep 1\n"
              "\t\t[ \"$fs_pass\" -eq 3 ] && return 1\n"
              "\tdone\n"
          )
          if old not in text and "for fs_pass in 1 2 3" not in text:
              raise SystemExit("expected e2fsck line in pi-gen/scripts/qcow2_handling")
          if old in text:
              qcow2.write_text(text.replace(old, new, 1))

          # fstrim on a rootfs that was not cleanly unmounted can contribute to
          # corrupt extents before export; sync is enough before umount.
          text = qcow2.read_text()
          old = '\tfstrim -v "${CURRENT_MOUNTPOINT}" || true\n'
          new = '\tsync\n\t# fstrim skipped during build: unsafe on busy/unclean rootfs\n'
          if old in text:
              qcow2.write_text(text.replace(old, new, 1))
          PY

      - name: Drop in the custom build stage
        run: |
          # pi-gen treats every top level folder that matches stage-* (or is
          # explicitly listed in config's STAGE_LIST) as a stage. We add ours
          # as stage5 so it runs after pi-gen's stock stage0-stage2 (which
          # produce the minimal Raspberry Pi OS Lite base image).
          cp -r pi-gen-stage pi-gen/stage5-smarttv

          # Our 00-copy-files step pulls in this repo's scripts/ and config/
          # folders so later steps in the stage can run them inside the chroot.
          mkdir -p pi-gen/stage5-smarttv/00-copy-files/files
          cp -r scripts pi-gen/stage5-smarttv/00-copy-files/files/
          cp -r config pi-gen/stage5-smarttv/00-copy-files/files/
          cp -r addons pi-gen/stage5-smarttv/00-copy-files/files/ 2>/dev/null || true

          # Make every script in our stage (and the repo scripts/ folder it
          # copies in) executable inside the chroot.
          find pi-gen/stage5-smarttv -name "*.sh" -exec chmod +x {} \;
          chmod +x scripts/*.sh

          # We only want stage0 (bootstrap), stage1 (minimal system),
          # stage2 (lite image, used purely as our base rootfs) and our own
          # stage5. We skip stage3/stage4 (the desktop environment) entirely
          # since this image boots straight into Kodi and never needs one.
          touch pi-gen/stage3/SKIP pi-gen/stage4/SKIP

          # Only our final stage should export a .img - stage2 builds a
          # valid Raspberry Pi OS Lite image by default, which we don't
          # want as a second/competing build artifact.
          touch pi-gen/stage2/SKIP_IMAGES
          # (pi-gen/stage5-smarttv/EXPORT_IMAGE, included in pi-gen-stage/
          # in this repo, is what marks our stage as the one to export.)

      - name: Write pi-gen config
        run: |
          cat > pi-gen/config <<EOF
          IMG_NAME=${IMG_NAME}
          RELEASE=${PI_GEN_RELEASE}
          DEPLOY_COMPRESSION=none
          LOCALE_DEFAULT=en_GB.UTF-8
          TARGET_HOSTNAME=smarttv-retropi
          KEYBOARD_KEYMAP=us
          KEYBOARD_LAYOUT="English (US)"
          TIMEZONE_DEFAULT=Etc/UTC
          FIRST_USER_NAME=pi
          FIRST_USER_PASS=raspberry
          ENABLE_SSH=1
          PUBKEY_SSH_FIRST_USER=
          STAGE_LIST="stage0 stage1 stage2 stage5-smarttv"
          EOF

      - name: Restore pi-gen work cache / skip base stages
        run: scripts/pi-gen-cache.sh prepare

      - name: Run pi-gen build
        run: |
          # pi-gen qcow2 stages require the nbd kernel module with partition
          # support. Load it explicitly before build.sh starts creating images.
          sudo modprobe nbd max_part=16
          cd pi-gen
          chmod +x build.sh
          sudo ./build.sh

      - name: Save pi-gen work cache
        if: success()
        run: scripts/pi-gen-cache.sh save

      - name: Locate build output
        id: locate
        run: |
          DEPLOY_DIR="pi-gen/deploy"
          ls -lh "${DEPLOY_DIR}"
          IMG_FILE=$(find "${DEPLOY_DIR}" -maxdepth 1 -iname "*.img" | head -n1)
          if [ -z "${IMG_FILE}" ]; then
            echo "No .img produced by pi-gen, check the build log above." >&2
            exit 1
          fi
          echo "img_file=${IMG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Compress image to .img.gz
        run: |
          IMG_FILE="${{ steps.locate.outputs.img_file }}"
          # pi-gen's own zerofree stage step already zeroes free blocks, so
          # we just need to gzip the result. -9 is slow but this only runs
          # once per release and keeps the artifact as small as possible.
          gzip -9 -c "${IMG_FILE}" > "${IMG_NAME}.img.gz"
          ls -lh "${IMG_NAME}.img.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMG_NAME }}-img-gz
          path: ${{ env.IMG_NAME }}.img.gz
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smart TV / Retro Pi 1 image - build ${{ github.run_number }}
          body: |
            Automated pi-gen build of the Smart TV + Retro Gaming image for
            Raspberry Pi 1 Model B/B+.

            Flash `${{ env.IMG_NAME }}.img.gz` with Raspberry Pi Imager,
            balenaEtcher, or `dd` (see README.md for full instructions).

            Default login: user `pi`, password `raspberry`. Change this on
            first boot.
          files: ${{ env.IMG_NAME }}.img.gz
          generate_release_notes: false
